server {
    listen 80;
    server_name localhost;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Location block for the API reverse proxy
    # All requests starting with /api/ will be forwarded to the backend API service
    location /api/ {
        # The 'api' hostname is the name of our backend service in docker-compose
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Location block for the frontend application
    # This will serve the index.html for any route that is not /api/
    # This is crucial for single-page applications (SPA) like React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
